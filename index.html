<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Songbooks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Crimson Text', serif; background-color: #fcf8f2; color: #2c221e; }
    h1, h2, h3, .heading-font { font-family: 'Cinzel', serif; }
    .parchment { background-color: #f5efe6; border: 1px solid #e2d5c3; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header Navigation -->
  <header class="bg-[#3c2a21] text-[#f5efe6] px-6 py-4 shadow-md flex justify-between items-center border-b-4 border-[#8c6747]">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">📖</span>
      <h1 class="text-xl md:text-2xl font-bold tracking-wide">Family Songbooks</h1>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="openModal('addSongModal')" class="bg-[#8c6747] hover:bg-[#a37954] text-white px-3 py-1.5 rounded text-sm font-sans flex items-center gap-1 transition">
        <span>+</span> Add Song
      </button>
      <button onclick="openModal('settingsModal')" title="Firebase Settings" class="p-2 hover:bg-[#523a2e] rounded-full transition text-lg">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-semibold text-[#3c2a21]">Song Archive</h2>
      <div class="flex items-center gap-2">
        <span id="syncStatus" class="inline-block w-2.5 h-2.5 rounded-full bg-gray-400"></span>
        <span id="syncText" class="text-xs font-sans text-gray-600">Local Only</span>
      </div>
    </div>
    
    <div id="songList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="parchment p-6 rounded-lg text-center text-gray-600 col-span-full">
        No songs added yet. Click "+ Add Song" to begin archiving!
      </div>
    </div>
  </main>

  <!-- Add Song Modal -->
  <div id="addSongModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-40">
    <div class="parchment w-full max-w-lg rounded-lg shadow-xl p-6 relative">
      <h3 class="text-xl font-bold text-[#3c2a21] mb-4">Add New Song</h3>
      <div class="space-y-4 font-sans text-sm">
        <div>
          <label class="block font-semibold mb-1">Song Title</label>
          <input type="text" id="songTitle" class="w-full p-2 border border-amber-900/20 rounded bg-white" placeholder="Amazing Grace">
        </div>
        <div>
          <label class="block font-semibold mb-1">Key / Artist</label>
          <input type="text" id="songKey" class="w-full p-2 border border-amber-900/20 rounded bg-white" placeholder="Key of G / Traditional">
        </div>
        <div>
          <label class="block font-semibold mb-1">Chords & Lyrics</label>
          <textarea id="songLyrics" rows="6" class="w-full p-2 border border-amber-900/20 rounded bg-white font-mono text-xs" placeholder="[G] Amazing grace, how [C] sweet the [G] sound..."></textarea>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3 font-sans text-sm">
        <button onclick="closeModal('addSongModal')" class="px-4 py-2 border border-gray-400 rounded">Cancel</button>
        <button onclick="saveSong()" class="px-4 py-2 bg-[#3c2a21] text-white rounded hover:bg-[#523a2e]">Save Song</button>
      </div>
    </div>
  </div>

  <!-- Firebase Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="parchment w-full max-w-md rounded-lg shadow-xl p-6 relative">
      <h3 class="text-xl font-bold text-[#3c2a21] mb-2">Firebase Cloud Setup</h3>
      <p class="text-xs font-sans text-gray-600 mb-4">Paste your free Firebase web keys below to sync songs across devices.</p>
      
      <div class="space-y-3 font-sans text-xs">
        <div>
          <label class="block font-semibold">apiKey</label>
          <input type="text" id="apiKey" class="w-full p-1.5 border rounded bg-white font-mono">
        </div>
        <div>
          <label class="block font-semibold">authDomain</label>
          <input type="text" id="authDomain" class="w-full p-1.5 border rounded bg-white font-mono">
        </div>
        <div>
          <label class="block font-semibold">projectId</label>
          <input type="text" id="projectId" class="w-full p-1.5 border rounded bg-white font-mono">
        </div>
        <div>
          <label class="block font-semibold">storageBucket</label>
          <input type="text" id="storageBucket" class="w-full p-1.5 border rounded bg-white font-mono">
        </div>
        <div>
          <label class="block font-semibold">messagingSenderId</label>
          <input type="text" id="messagingSenderId" class="w-full p-1.5 border rounded bg-white font-mono">
        </div>
        <div>
          <label class="block font-semibold">appId</label>
          <input type="text" id="appId" class="w-full p-1.5 border rounded bg-white font-mono">
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-3 font-sans text-sm">
        <button onclick="closeModal('settingsModal')" class="px-4 py-2 border border-gray-400 rounded">Cancel</button>
        <button onclick="saveConfig()" class="px-4 py-2 bg-[#3c2a21] text-white rounded hover:bg-[#523a2e]">Save Configuration</button>
      </div>
    </div>
  </div>

  <script>
    let db = null;
    let songs = JSON.parse(localStorage.getItem('fs_songs') || '[]');

    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function initFirebase() {
      const cfg = JSON.parse(localStorage.getItem('fs_firebase_cfg') || '{}');
      if (cfg.apiKey && cfg.projectId) {
        try {
          if (!firebase.apps.length) firebase.initializeApp(cfg);
          db = firebase.firestore();
          document.getElementById('syncStatus').className = 'inline-block w-2.5 h-2.5 rounded-full bg-green-500';
          document.getElementById('syncText').innerText = 'Cloud Synced';
          loadCloudSongs();
        } catch(e) {
          console.error(e);
          document.getElementById('syncStatus').className = 'inline-block w-2.5 h-2.5 rounded-full bg-red-500';
          document.getElementById('syncText').innerText = 'Connection Error';
        }
      }
    }

    function saveConfig() {
      const cfg = {
        apiKey: document.getElementById('apiKey').value.trim(),
        authDomain: document.getElementById('authDomain').value.trim(),
        projectId: document.getElementById('projectId').value.trim(),
        storageBucket: document.getElementById('storageBucket').value.trim(),
        messagingSenderId: document.getElementById('messagingSenderId').value.trim(),
        appId: document.getElementById('appId').value.trim()
      };
      localStorage.setItem('fs_firebase_cfg', JSON.stringify(cfg));
      closeModal('settingsModal');
      initFirebase();
    }

    function renderSongs() {
      const container = document.getElementById('songList');
      if (!songs.length) {
        container.innerHTML = `<div class="parchment p-6 rounded-lg text-center text-gray-600 col-span-full">No songs saved yet. Click "+ Add Song" to begin!</div>`;
        return;
      }
      container.innerHTML = songs.map(s => `
        <div class="parchment p-5 rounded-lg shadow-sm border border-[#e2d5c3]">
          <h3 class="font-bold text-lg text-[#3c2a21]">${s.title}</h3>
          <p class="text-xs font-sans text-[#8c6747] mb-3">${s.key || 'Standard Key'}</p>
          <pre class="whitespace-pre-wrap font-mono text-xs bg-white/60 p-3 rounded border border-amber-900/10 text-gray-800">${s.lyrics || ''}</pre>
        </div>
      `).join('');
    }

    function saveSong() {
      const title = document.getElementById('songTitle').value;
      const key = document.getElementById('songKey').value;
      const lyrics = document.getElementById('songLyrics').value;
      if (!title) return alert('Please enter a title');

      const newSong = { title, key, lyrics, id: Date.now().toString() };
      songs.push(newSong);
      localStorage.setItem('fs_songs', JSON.stringify(songs));

      if (db) {
        db.collection('songs').doc(newSong.id).set(newSong);
      }

      renderSongs();
      closeModal('addSongModal');
      document.getElementById('songTitle').value = '';
      document.getElementById('songKey').value = '';
      document.getElementById('songLyrics').value = '';
    }

    function loadCloudSongs() {
      if (!db) return;
      db.collection('songs').onSnapshot(snap => {
        const cloudSongs = [];
        snap.forEach(doc => cloudSongs.push(doc.data()));
        if (cloudSongs.length) {
          songs = cloudSongs;
          renderSongs();
        }
      });
    }

    // Populate input fields if configuration exists in localStorage
    const savedCfg = JSON.parse(localStorage.getItem('fs_firebase_cfg') || '{}');
    ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(k => {
      if (savedCfg[k] && document.getElementById(k)) {
        document.getElementById(k).value = savedCfg[k];
      }
    });

    renderSongs();
    initFirebase();
  </script>
</body>
</html>
